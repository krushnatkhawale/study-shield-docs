site_name: StudyShield / Open-School Docs
site_description: Aggregated documentation for the StudyShield product family (mobile, TV, backend modulith, admin) and the Open-School / private digital school.
# SITE_URL is set in CI (GitHub Actions / GitLab Pages). Local default is the dev server.
site_url: !ENV [SITE_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/krushnatkhawale/study-shield-docs
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
  - tables
nav:
  - Home: index.md
  - Backlog:
      - How we use this backlog: backlog/index.md
      - Feed a story to Buzz: backlog/llm-brief.md
      - Code audit (implemented vs not): backlog/code-audit.md
      - Experience: backlog/experience.md
      - Design: backlog/design.md
      - Business value: backlog/business-value.md
      - Reliability: backlog/reliability.md
      - Content: backlog/content.md
      - Quality and speed: backlog/quality-and-speed.md
  - Architecture:
      - Overall system: architecture/system.md
      - Backend modulith: architecture/backend.md
      - Mobile & TV apps: architecture/mobile-tv.md
  - Per-repo guides:
      - Backend (study-shield-backend): per-repo/backend.md
      - Admin (study-shield-backend-admin): per-repo/admin.md
      - Mobile & TV (study-shield): per-repo/mobile-tv.md
      - Open-School: per-repo/open-school.md
  - Decisions:
      - Question bank process & rules: decisions/question-bank-guide.md
      - Decision log (ADR): decisions/adr-log.md
      - Diagramming standard: decisions/diagramming-standard.md
